[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# A URL real e resolvida dinamicamente em alembic/env.py a partir de
# src.config.settings (Settings.migration_connection), entao este valor
# nunca e usado de fato - existe apenas para satisfazer o parser do Alembic.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
